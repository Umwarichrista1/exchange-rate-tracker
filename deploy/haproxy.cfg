global 
log /dev/log loal0
maxconn 2048
user haproxy
group haproxy
daemon


defaults

log global
mode http
option httplog
option dontlognull
timeout connect 5s
timeout client 30s
timeout server 30s

frontend http_front
bind*:80
default_backend app_server

backend  app_servers
balance roundrobin
option httpchk GET /
server web-01 1.40.9.218:80 check
server web-02 16.60.164.228:80 check